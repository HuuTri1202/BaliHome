<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bali Home — Logo 3D</title>
  <link rel="icon" href="assets/logo.png" />

  <!-- Font hỗ trợ tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN, dùng cho prototype) -->
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'] },
          colors: { brand: { blue: '#1E5BD8', navy: '#0E2A7A', red: '#E5232D' } },
        },
      },
    };
  </script>

  <!-- Three.js, GSAP, React, ReactDOM, Babel (viết JSX trực tiếp trong trình duyệt) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Engine logo 3D (Three.js thuần) -->
  <script src="js/logo3d.js"></script>

  <style>
    /* Đăng ký biến màu để gradient nền có thể transition mượt khi đổi phong cách */
    @property --c1 { syntax: '<color>'; inherits: true; initial-value: #dce8ff; }
    @property --c2 { syntax: '<color>'; inherits: true; initial-value: #ffffff; }
    @property --c3 { syntax: '<color>'; inherits: true; initial-value: #1e5bd8; }

    body {
      background:
        radial-gradient(60% 55% at 50% 45%, color-mix(in srgb, var(--c3) 22%, transparent), transparent 70%),
        radial-gradient(120% 90% at 0% 0%, var(--c2), transparent 60%),
        linear-gradient(160deg, var(--c1), var(--c2));
      background-color: #f3f6ff;
      transition: --c1 .8s ease, --c2 .8s ease, --c3 .8s ease;
      min-height: 100vh;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .animate-rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .delay-1 { animation-delay: .08s; }
    .delay-2 { animation-delay: .16s; }

    /* Chữ khổng lồ viền rỗng phía sau logo */
    .outline-word {
      -webkit-text-stroke: 2px color-mix(in srgb, var(--c3) 35%, transparent);
      color: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-rise { animation: none; }
      body { transition: none; }
    }
  </style>
</head>
<body class="font-sans text-slate-900 antialiased overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    /* ==========================================================================
     *  CÁC PHONG CÁCH LOGO
     *  ui        : màu chữ/nút trên trang (đủ đậm để đọc)
     *  primary   : màu chính (nửa dưới khung + ký hiệu A/G)
     *  secondary : màu phụ (nửa trên khung + tam giác nhỏ)
     *  plate     : màu tấm nền bên trong
     *  metalness / roughness : chất liệu (1 = kim loại, roughness nhỏ = bóng)
     *  bg        : [c1, c2, c3] cho gradient nền trang
     * ========================================================================== */
    const THEMES = [
      { id: 'classic', name: 'Nguyên bản', short: 'Classic',
        ui: '#1E5BD8', primary: '#1E5BD8', secondary: '#E5232D', plate: '#F4F6FB', metalness: 0.15, roughness: 0.3,
        bg: ['#DCE8FF', '#FFFFFF', '#1E5BD8'],
        desc: 'Xanh dương và đỏ: hai màu nhận diện của Bali Home, thể hiện sự tin cậy và nhiệt huyết.' },
      { id: 'chrome', name: 'Bạc Chrome', short: 'Chrome',
        ui: '#475569', primary: '#C9D1DC', secondary: '#8A97A8', plate: '#FFFFFF', metalness: 1, roughness: 0.15,
        bg: ['#E6EAF0', '#FFFFFF', '#64748B'],
        desc: 'Phiên bản kim loại bóng, dùng cho biển hiệu, bảng tên và quà tặng doanh nghiệp.' },
      { id: 'gold', name: 'Vàng Kim', short: 'Gold',
        ui: '#A8650F', primary: '#E2B13C', secondary: '#B8741A', plate: '#FFF8E7', metalness: 1, roughness: 0.25,
        bg: ['#FFF1CF', '#FFFDF6', '#C98A1B'],
        desc: 'Phiên bản vàng kim sang trọng dành cho sự kiện, kỷ niệm và ấn phẩm cao cấp.' },
      { id: 'navy', name: 'Xanh Đêm', short: 'Navy',
        ui: '#0E2A7A', primary: '#0E2A7A', secondary: '#E5232D', plate: '#DCE6FA', metalness: 0.4, roughness: 0.3,
        bg: ['#C9D7F5', '#EEF3FF', '#0E2A7A'],
        desc: 'Tông xanh đậm trầm tĩnh, phù hợp hồ sơ năng lực và tài liệu chính thức.' },
      { id: 'ruby', name: 'Đỏ Ruby', short: 'Ruby',
        ui: '#C81E2B', primary: '#C81E2B', secondary: '#1E5BD8', plate: '#FFF1F1', metalness: 0.3, roughness: 0.25,
        bg: ['#FFDADD', '#FFF6F6', '#C81E2B'],
        desc: 'Đảo màu chủ đạo sang đỏ: nổi bật cho các chiến dịch khuyến mãi và truyền thông.' },
    ];

    /* ==========================================================================
     *  LogoCanvas — cầu nối React ↔ Three.js
     *  - Khởi tạo Logo3D 1 lần khi mount, dispose khi unmount
     *  - Khi prop `theme` đổi → gọi logo.setTheme() (nhảy + đổi màu)
     * ========================================================================== */
    function LogoCanvas({ theme }) {
      const boxRef = useRef(null);
      const logoRef = useRef(null);

      useEffect(() => {
        logoRef.current = new Logo3D(boxRef.current, { theme });
        return () => logoRef.current.dispose();
      }, []);

      useEffect(() => { logoRef.current && logoRef.current.setTheme(theme); }, [theme]);

      return <div ref={boxRef} className="absolute inset-0" aria-label="Logo Bali Home 3D, kéo để xoay" />;
    }

    /* ==========================================================================
     *  Thanh điều hướng
     * ========================================================================== */
    function Navbar({ theme }) {
      return (
        <header className="relative z-20 mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-8">
          <a href="#" className="flex items-center gap-3">
            <img src="assets/logo.png" alt="Bali Home" className="h-11 w-11 rounded-xl bg-white p-1 shadow-sm" />
            <div className="leading-tight">
              <div className="text-lg font-extrabold tracking-tight text-brand-navy">BALI HOME</div>
              <div className="text-[11px] font-medium uppercase tracking-[.18em] text-slate-500">Thương mại · Dịch vụ</div>
            </div>
          </a>
          <nav className="hidden items-center gap-8 text-sm font-semibold text-slate-600 md:flex">
            <a href="#" className="hover:text-slate-900">Giới thiệu</a>
            <a href="#" className="hover:text-slate-900">Dịch vụ</a>
            <a href="#" className="hover:text-slate-900">Dự án</a>
            <a href="#" className="hover:text-slate-900">Liên hệ</a>
          </nav>
          <button
            className="rounded-full px-5 py-2.5 text-sm font-bold text-white shadow-lg hover:-translate-y-0.5"
            style={{ backgroundColor: theme.ui, transition: 'background-color .6s, transform .2s' }}
          >
            Liên hệ
          </button>
        </header>
      );
    }

    /* ==========================================================================
     *  Nút chọn phong cách logo
     * ========================================================================== */
    function ThemePicker({ active, onSelect }) {
      return (
        <div className="flex flex-wrap justify-center gap-2 sm:gap-3" role="radiogroup" aria-label="Chọn phong cách logo">
          {THEMES.map((t) => {
            const isActive = t.id === active.id;
            return (
              <button
                key={t.id}
                role="radio"
                aria-checked={isActive}
                onClick={() => onSelect(t)}
                className={
                  'group flex items-center gap-2 rounded-full border py-1.5 pl-1.5 pr-4 text-sm font-semibold backdrop-blur transition-all duration-300 ' +
                  (isActive
                    ? 'scale-105 border-transparent bg-white text-slate-900 shadow-xl'
                    : 'border-white/70 bg-white/45 text-slate-600 hover:-translate-y-0.5 hover:bg-white/80')
                }
              >
                <span
                  className="h-8 w-8 rounded-full ring-2 ring-white transition-transform group-hover:rotate-45"
                  style={{ background: `linear-gradient(135deg, ${t.secondary} 0 50%, ${t.primary} 50% 100%)` }}
                />
                {t.short}
              </button>
            );
          })}
        </div>
      );
    }

    /* ==========================================================================
     *  App
     * ========================================================================== */
    function App() {
      const [theme, setTheme] = useState(THEMES[0]);

      // Đồng bộ màu gradient nền qua CSS variables
      useEffect(() => {
        const s = document.body.style;
        s.setProperty('--c1', theme.bg[0]);
        s.setProperty('--c2', theme.bg[1]);
        s.setProperty('--c3', theme.bg[2]);
      }, [theme]);

      // Phím mũi tên trái/phải để đổi phong cách
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          setTheme((cur) => {
            const i = THEMES.indexOf(cur);
            return THEMES[(i + (e.key === 'ArrowRight' ? 1 : -1) + THEMES.length) % THEMES.length];
          });
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const index = THEMES.indexOf(theme) + 1;

      return (
        <div className="relative min-h-screen">
          <Navbar theme={theme} />

          <main className="relative mx-auto grid max-w-7xl grid-cols-1 items-center gap-6 px-4 pb-10 sm:px-8 lg:grid-cols-[1fr_1.35fr_1fr] lg:gap-4">
            {/* ---------- Cột trái: tiêu đề ---------- */}
            <section className="order-1 text-center lg:text-left">
              <p key={theme.id + '-eyebrow'} className="animate-rise text-xs font-bold uppercase tracking-[.25em]" style={{ color: theme.ui }}>
                Phong cách {String(index).padStart(2, '0')} / {String(THEMES.length).padStart(2, '0')} · {theme.name}
              </p>
              <h1 className="mt-3 text-5xl font-black leading-[1.02] tracking-tight text-slate-900 sm:text-6xl">
                BALI <span style={{ color: theme.ui, transition: 'color .6s' }}>HOME</span>
              </h1>
              <p className="mt-2 text-sm font-bold uppercase tracking-wide text-slate-500">
                Công ty TNHH Thương mại Dịch vụ Bali Home
              </p>
              <p key={theme.id + '-desc'} className="animate-rise delay-1 mx-auto mt-4 max-w-sm text-[15px] leading-relaxed text-slate-600 lg:mx-0">
                {theme.desc}
              </p>
              <div className="mt-6 flex items-center justify-center gap-3 lg:justify-start">
                <a href="#" className="rounded-full px-6 py-3 text-sm font-bold text-white shadow-lg"
                   style={{ backgroundColor: theme.ui, transition: 'background-color .6s' }}>
                  Khám phá dịch vụ
                </a>
                <a href="#" className="rounded-full border border-slate-300 bg-white/60 px-6 py-3 text-sm font-bold text-slate-700 backdrop-blur hover:bg-white">
                  Về chúng tôi
                </a>
              </div>
            </section>

            {/* ---------- Cột giữa: canvas 3D ---------- */}
            <section className="relative order-2 h-[420px] sm:h-[520px] lg:h-[calc(100vh-220px)] lg:min-h-[520px]">
              <div className="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden">
                <span className="outline-word select-none whitespace-nowrap text-[24vw] font-black uppercase leading-none lg:text-[14vw]">
                  Bali
                </span>
              </div>
              <LogoCanvas theme={theme} />
              <p className="pointer-events-none absolute bottom-2 left-0 right-0 text-center text-xs font-medium text-slate-500">
                Rê chuột hoặc kéo để xoay logo
              </p>
            </section>

            {/* ---------- Cột phải: giá trị cốt lõi ---------- */}
            <aside className="order-4 lg:order-3">
              <div className="mx-auto max-w-sm rounded-3xl border border-white/70 bg-white/55 p-6 shadow-xl shadow-slate-900/5 backdrop-blur-md">
                <h2 className="text-sm font-bold uppercase tracking-[.18em] text-slate-500">Giá trị cốt lõi</h2>
                <ul className="mt-4 space-y-4">
                  {[
                    ['Uy tín', 'Cam kết minh bạch trong từng giao dịch.'],
                    ['Chất lượng', 'Sản phẩm và dịch vụ được kiểm soát chặt chẽ.'],
                    ['Tận tâm', 'Đồng hành cùng khách hàng trước và sau bán.'],
                  ].map(([title, text]) => (
                    <li key={title} className="flex gap-3">
                      <span className="mt-1.5 h-2.5 w-2.5 shrink-0 rotate-45" style={{ backgroundColor: theme.secondary, transition: 'background-color .6s' }} />
                      <div>
                        <div className="text-[15px] font-bold text-slate-800">{title}</div>
                        <div className="text-sm text-slate-500">{text}</div>
                      </div>
                    </li>
                  ))}
                </ul>
                <button
                  className="mt-6 w-full rounded-2xl py-3 font-bold text-white hover:brightness-110"
                  style={{ backgroundColor: theme.ui, transition: 'background-color .6s' }}
                >
                  Nhận tư vấn
                </button>
              </div>
            </aside>

            {/* ---------- Hàng dưới: chọn phong cách ---------- */}
            <div className="order-3 lg:order-4 lg:col-span-3">
              <ThemePicker active={theme} onSelect={setTheme} />
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
